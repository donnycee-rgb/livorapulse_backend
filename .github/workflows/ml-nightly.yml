name: ML nightly

# 00:45 Nairobi (21:45 UTC), after the API builds yesterday's DailyFeatures at
# 00:30. GitHub may start scheduled runs some minutes late; that's fine.
on:
  schedule:
    - cron: "45 21 * * *"
  workflow_dispatch: # "Run workflow" button in the Actions tab

concurrency:
  group: ml-nightly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r requirements.txt
      - name: Fit the model and publish effects and forecasts
        env:
          # Repo Settings -> Secrets and variables -> Actions. A login limited
          # to the ML tables (ml/sql/ml_role.sql), not the main database URL.
          ML_DATABASE_URL: ${{ secrets.ML_DATABASE_URL }}
        run: python -m livora_ml.job | tee -a "$GITHUB_STEP_SUMMARY"
