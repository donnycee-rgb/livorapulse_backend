name: ML tests

on:
  push:
    paths: ["ml/**", ".github/workflows/ml-tests.yml"]
  pull_request:
    paths: ["ml/**", ".github/workflows/ml-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Model report on simulated users
        run: python -m livora_ml.evaluate >> "$GITHUB_STEP_SUMMARY"
