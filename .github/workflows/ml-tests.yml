name: ML tests

on:
  push:
    paths: ["ml/**", "prisma/**", "src/services/MoodForecast.ts", "test/moodForecast.test.ts", ".github/workflows/ml-tests.yml"]
  pull_request:
    paths: ["ml/**", "prisma/**", "src/services/MoodForecast.ts", "test/moodForecast.test.ts", ".github/workflows/ml-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      # The job's database tests run on an in-memory Postgres with the app's
      # migrations applied, which needs Node and the backend's packages
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: .
      - run: pip install -r requirements.txt
      - run: python -m pytest -q -rs
      - name: API forecast matches Python (parity)
        working-directory: .
        run: npx vitest run test/moodForecast.test.ts
      - name: Model report on simulated users
        run: python -m livora_ml.evaluate >> "$GITHUB_STEP_SUMMARY"
